name: Publish package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Update npm (stage publish needs a recent CLI)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate
        run: yarn validate

      - name: Run tests
        run: yarn test

      - name: Build package
        run: yarn build

      - name: Stage package on npm
        run: npm stage publish --access public